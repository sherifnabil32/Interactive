<script>
const Q=[
{q:'صممت مؤسسة شبكة تحتوي على جدار حماية قوي، لكن خادم الويب المتصل بالإنترنت تعرض للاختراق. أي تصميم يقلل احتمال وصول المهاجم إلى قاعدة البيانات السرية؟',o:['وضع خادم الويب وقاعدة البيانات في DMZ نفسها، مع الاعتماد على جدار الحماية الخارجي.','وضع خادم الويب في DMZ، وفصل الشبكة الداخلية عنه مع تقييد الاتصالات المسموح بها.','استخدام VPN لجميع الموظفين، مع السماح لخادم الويب بالاتصال المباشر بقاعدة البيانات.','تحديث أجهزة الموظفين فقط، لأن اختراق الخادم لا يؤثر على الشبكة الداخلية.'],a:1},
{q:'موظف يعمل من شبكة Wi-Fi عامة واتصل بمؤسسة باستخدام VPN. أي العبارات التالية هي الأدق؟',o:['أصبح جهاز الموظف موثوقًا تلقائيًا بمجرد نجاح اتصال VPN.','يمنع VPN جميع أنواع الهجمات على جهاز الموظف ما دام الاتصال مشفرًا.','يساعد VPN على حماية البيانات أثناء انتقالها، لكن تظل المصادقة والتحديثات وبقية الضوابط ضرورية.','يلغي VPN الحاجة إلى جدار الحماية، لأن الاتصال أصبح خاصًا.'],a:2},
{q:'تعتمد مؤسسة على جدار حماية فقط، وتسمح للمستخدمين داخل الشبكة بالوصول إلى الموارد دون فحص إضافي. ما التغيير الأكثر توافقًا مع نهج انعدام الثقة (Zero Trust)؟',o:['زيادة قوة جدار الحماية مع استمرار الثقة في كل مستخدم داخل الشبكة.','السماح لكل جهاز متصل بالشبكة الداخلية بالوصول إلى جميع الخوادم.','فحص هوية المستخدم وصلاحياته وسياق طلب الوصول وفق سياسة المؤسسة.','نقل جميع الخوادم إلى DMZ واعتبار أي اتصال داخلي آمنًا.'],a:2},
{q:'أي السيناريوهات التالية يوضح مفهوم الدفاع في العمق (Defense in Depth) بأفضل صورة؟',o:['وجود جدار حماية قوي يمنع جميع الاتصالات غير المصرح بها، دون الحاجة إلى ضوابط أخرى.','تشفير الاتصال باستخدام VPN، مع إلغاء برامج مكافحة الفيروسات لتقليل التكلفة.','استخدام جدار حماية وVPN وDMZ وحماية الأجهزة الطرفية، بحيث تقلل الطبقات الأخرى أثر فشل إحداها.','وضع جميع الخوادم والأجهزة في شبكة واحدة، مع تحديث جدار الحماية بصورة دورية.'],a:2},
{q:'خادم بريد عام موجود في الشبكة الداخلية، بينما قاعدة البيانات السرية محمية بجدار حماية خارجي. ما أفضل تعديل لتقليل أثر اختراق خادم البريد؟',o:['نقل خادم البريد إلى DMZ، مع فصل الشبكة الداخلية وتقييد الاتصالات بينها.','نقل قاعدة البيانات إلى DMZ مع خادم البريد، لتقليل عدد الشبكات.','إضافة VPN بين خادم البريد والإنترنت، دون تغيير تقسيم الشبكة.','الاكتفاء بتحديث نظام خادم البريد، لأن التحديثات تمنع انتقال الاختراق.'],a:0},
{q:'أي عبارة تميز بدقة بين Firewall وVPN وDMZ؟',o:['جدار الحماية يشفر الاتصال، وVPN يفصل الخوادم العامة، وDMZ يتحقق من هوية المستخدم.','جدار الحماية يتحكم في الاتصالات وفق قواعد، وVPN ينشئ اتصالًا مشفرًا، وDMZ تعزل الخوادم المواجهة للجمهور.','جدار الحماية يتحقق من سياق كل طلب بالضرورة، وVPN يمنع اختراق الأجهزة، وDMZ تشفر قواعد البيانات.','جدار الحماية وVPN يؤديان الوظيفة نفسها، بينما DMZ بديل عن حماية الأجهزة الطرفية.'],a:1},
{q:'تطبق مؤسسة التحديثات ومكافحة الفيروسات على أجهزة الموظفين، لكنها لا تفصل خوادمها العامة عن شبكتها الداخلية. ما الاستنتاج الأدق؟',o:['تحقق الدفاع في العمق بالكامل، لأن حماية الأجهزة الطرفية تكفي لمنع انتقال الاختراق.','تطبق طبقة من الدفاع في العمق، لكن لا تزال هناك حاجة إلى عزل الخوادم العامة وبقية الضوابط.','تحتاج إلى VPN فقط؛ لأنه يؤدي وظيفة DMZ نفسها.','لا تحتاج إلى فصل الشبكات إذا كان جدار الحماية محدثًا.'],a:1},
{q:'أي موقف يُعد مثالًا على الثقة التقليدية داخل الشبكة، وليس تطبيقًا كاملًا لنهج Zero Trust؟',o:['التحقق من هوية المستخدم وصلاحياته عند طلب الوصول إلى مورد حساس.','تقييم سياق طلب الوصول وفق سياسة المؤسسة.','اعتبار الجهاز موثوقًا لمجرد أنه متصل بالشبكة الداخلية.','تقييد وصول المستخدم وفق الصلاحيات الممنوحة له.'],a:2},
{q:'نجح مهاجم في تجاوز جدار الحماية الخارجي. ما الاستنتاج الذي يتفق أكثر مع فكرة الدفاع في العمق؟',o:['أصبحت كل الضوابط الأخرى عديمة الفائدة بعد فشل الجدار الناري.','ينبغي الاعتماد على VPN وحده لمنع أي محاولة اختراق أخرى.','يمكن للطبقات الأخرى، مثل عزل DMZ وحماية الأجهزة الطرفية، أن تقلل احتمال انتشار الهجوم وأثره.','يثبت الاختراق أن استخدام أكثر من طبقة أمنية لا يقدم فائدة حقيقية.'],a:2},
{q:'يريد موظف الوصول عن بُعد إلى خادم داخل المؤسسة. أي تصميم يعالج أمان الاتصال وأمان الوصول معًا بأفضل صورة؟',o:['VPN فقط، مع منح الموظف صلاحية الوصول إلى جميع موارد الشبكة.','Firewall فقط، مع السماح بأي اتصال يأتي من جهاز الموظف.','VPN لتأمين مسار الاتصال، مع التحقق من الهوية والصلاحيات وتطبيق قواعد الوصول المناسبة.','وضع خادم المؤسسة في DMZ، وإلغاء الحاجة إلى التحقق من المستخدم.'],a:2},
{q:'اكتشفت المؤسسة أن خادم الويب في DMZ مخترق، لكن قاعدة البيانات السرية لم تتعرض للاختراق. أي تفسير هو الأكثر منطقية؟',o:['وجود الخادم في DMZ يجعل اختراقه مستحيلًا، وبالتالي لا بد أن الإنذار خاطئ.','فصل الخوادم العامة عن الشبكة الداخلية وتقييد الاتصالات قد يقللان فرص انتقال المهاجم إلى قاعدة البيانات.','تشفير VPN يمنع أي مهاجم من الوصول إلى خادم ويب مخترق.','جدار الحماية الخارجي وحده يضمن عدم إمكانية الوصول إلى قاعدة البيانات بعد اختراق الخادم.'],a:1},
{q:'طبقت مؤسسة جدار حماية وVPN وDMZ، لكنها تمنح كل مستخدم تم التحقق من هويته صلاحية الوصول إلى جميع الأنظمة. ما نقطة الضعف الأوضح؟',o:['غياب التحقق من الهوية؛ لأن Zero Trust لا يستخدم المصادقة.','عدم استخدام VPN؛ لأن وجود DMZ يلغي فائدته.','الإفراط في فصل الشبكة؛ لأن DMZ تمنع الاتصال بين جميع الأنظمة بالضرورة.','منح صلاحيات أوسع من اللازم، وعدم ربط الوصول بالصلاحيات وسياق الطلب وفق السياسة.'],a:3},
{q:'أي تعديل يعالج مشكلة مختلفة عن المشكلة الأساسية التي يعالجها VPN؟',o:['تشفير اتصال موظف يعمل من خارج المؤسسة.','حماية مسار الاتصال من التنصت عبر شبكة عامة.','فصل خادم الويب المواجه للجمهور عن الشبكة الداخلية.','إنشاء اتصال خاص مشفر بين موظف بعيد والمؤسسة.'],a:2},
{q:'تعرض جهاز موظف للاختراق رغم وجود جدار حماية وVPN وDMZ في المؤسسة. أي إجراء يرتبط مباشرة بطبقة حماية الأجهزة الطرفية في الدرس؟',o:['تحديث نظام الجهاز واستخدام مكافحة الفيروسات.','نقل جهاز الموظف إلى DMZ باعتباره خادمًا عامًا.','إلغاء المصادقة لتسهيل اكتشاف الاختراق.','اعتبار اتصال الجهاز آمنًا لأنه مر عبر VPN.'],a:0},
{q:'مؤسسة تريد تقليل احتمال أن يؤدي اختراق واحد إلى كشف شبكتها بالكامل. أي اقتراح هو الأكثر اكتمالًا وفقًا للدرس؟',o:['الاستثمار في أقوى جدار حماية ممكن، وتأجيل بقية الإجراءات.','وضع كل الخدمات في DMZ مع السماح لجميعها بالاتصال بالشبكة الداخلية.','استخدام VPN لجميع الاتصالات، مع الثقة التلقائية في كل جهاز متصل.','الجمع بين Firewall وVPN وDMZ وحماية الأجهزة الطرفية، والتحقق من كل طلب وصول وفق السياسة.'],a:3}

  const q=Q[st.i],sel=st.ans[st.i],n=Q.length;
  app.style.setProperty('--c','var(--blue)');
  app.innerHTML='<div class="prog"><i style="width:'+(st.i/n*100)+'%"></i></div><div class="cnt"><span>السؤال '+(st.i+1)+' من '+n+'</span><span>'+esc(st.name)+'</span></div><div class="q">'+esc(q.q)+'</div><div id="os" class="'+(sel!==undefined?'locked':'')+'">'+q.o.map((t,k)=>'<button class="opt'+(sel===k?' sel':'')+'" data-k="'+k+'"><b>'+L[k]+'</b><span>'+esc(t)+'</span></button>').join('')+'</div><button class="btn" id="nx"'+(sel===undefined?' disabled':'')+'>'+(st.i===n-1?'إنهاء الاختبار':'السؤال التالي')+'</button>';
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(st.ans[st.i]!==undefined)return;
    st.ans[st.i]=+b.dataset.k;sv(KS,st);ask();
  });
  $('nx').onclick=()=>{
    if(st.i===n-1){finish()}else{st.i++;sv(KS,st);ask()}
  };
}
async function sendSheet(r){
  if(!SHEET_URL||SHEET_URL.indexOf('https://')!==0)return false;
  try{
    await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:r.name,score:r.sc,total:Q.length})});
    sv('nsq22_sent',1);return true;
  }catch(e){return false}
}
function waLink(r){
  const t='النتيجة: '+r.name+' — '+r.sc+' من '+Q.length+' في اختبار الدرس 2-2 (تصميم أمان الشبكات)';
  return 'https://wa.me/201032901861?text='+encodeURIComponent(t);
}
function finish(){
  const sc=Q.reduce((s,q,i)=>s+(st.ans[i]===q.a?1:0),0);
  const res={name:st.name,ans:st.ans,sc};
  sv(KD,res);sv(KS,null);show(res,false);sendSheet(res).then(ok=>{const el=$('sst');if(el)el.textContent=ok?'تم إرسال نتيجتك للمدرس تلقائيًا ✔':''});
}
function show(r,again){
  const n=Q.length,p=Math.round(r.sc/n*100),good=p>=50;
  app.style.setProperty('--c',good?'var(--green)':'var(--red)');
  let h='<div class="score"><div class="m">'+esc(r.name)+'</div><div class="n">'+r.sc+' / '+n+'</div><div class="m">'+p+'%'+(p>=90?' — ممتاز!':p>=75?' — جيد جدًا':p>=50?' — جيد':' — محتاج مراجعة للدرس')+'</div></div>';
  if(again)h+='<div class="warn">أنت أديت الاختبار قبل كده، ومسموح بمحاولة واحدة فقط. دي نتيجتك.</div>';
  h+='<div id="sst" style="text-align:center;color:var(--green);font-weight:800;min-height:1.6em"></div>';
  h+='<div class="warn" style="background:#25d36614;border-color:#25d366;color:#c9f7da">ولو حابب تأكيد إضافي، ابعت نتيجتك بنفسك على واتساب بالزرار الأخضر تحت.</div>';
  h+='<div class="wa-row" style="margin:0 0 10px"><a class="wa" href="'+waLink(r)+'" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a1 1 0 011 1v12a1 1 0 01-1 1H8.5L4 21.5V17H4a1 1 0 01-1-1V4a1 1 0 011-1z"/></svg>ابعت نتيجتك لأ/ شريف على واتساب</a></div>';
  h+='<h3 style="margin:14px 0 4px">مراجعة الإجابات</h3>';
  Q.forEach((q,i)=>{
    const ok=r.ans[i]===q.a;
    h+='<div class="rv'+(ok?'':' bad')+'"><div class="qq">'+(i+1)+') '+esc(q.q)+'</div>'+(ok?'<div class="g">إجابتك صح: '+L[q.a]+') '+esc(q.o[q.a])+'</div>':'<div class="r">إجابتك: '+(r.ans[i]!==undefined?L[r.ans[i]]+') '+esc(q.o[r.ans[i]]):'لم تجب')+'</div><div class="g">الإجابة الصحيحة: '+L[q.a]+') '+esc(q.o[q.a])+'</div>')+'</div>';
  });
  app.innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}
if(done){show(done,true);if(!ld('nsq22_sent'))sendSheet(done)}
else if(st&&st.name)ask();
else start();
</script>
